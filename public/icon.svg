<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="eduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#eduGrad)" />

  <!-- Inner Subtle Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2"/>

  <!-- Academic Cap & School Crest Motif -->
  <g transform="translate(256, 240)" filter="url(#shadow)">
    <!-- Graduation Cap Top -->
    <path d="M 0 -100 L 160 -30 L 0 40 L -160 -30 Z" fill="#ffffff" />
    <path d="M 0 -85 L 140 -25 L 0 35 L -140 -25 Z" fill="#f0fdf4" />
    
    <!-- Cap Base -->
    <path d="M -85 5 L -85 65 C -85 105 85 105 85 65 L 85 5 C 60 25 -60 25 -85 5 Z" fill="#f8fafc" />
    <path d="M -80 15 L -80 60 C -80 95 80 95 80 60 L 80 15 C 55 30 -55 30 -80 15 Z" fill="#10b981" />

    <!-- Tassel -->
    <path d="M 120 -15 C 135 20, 140 60, 145 100" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" />
    <circle cx="145" cy="110" r="10" fill="#f59e0b" />
    <path d="M 140 115 L 140 145 M 145 115 L 145 150 M 150 115 L 150 145" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Burkina Faso Star Accent & Book -->
  <g transform="translate(256, 385)">
    <!-- Book pages -->
    <path d="M -110 0 C -60 -20 -20 0 0 15 C 20 0 60 -20 110 0 L 110 40 C 60 20 20 40 0 55 C -20 40 -60 20 -110 40 Z" fill="#ffffff" />
    <!-- Yellow star in center -->
    <polygon points="0,-18 5,-4 20,-4 8,5 12,19 0,10 -12,19 -8,5 -20,-4 -5,-4" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />
  </g>

  <!-- App Label in Icon -->
  <text x="256" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ecfdf5" letter-spacing="4">EDUNOVA</text>
</svg>
